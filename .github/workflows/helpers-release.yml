name: Build and release Semvi helpers
on:
  push:
    tags: ['helpers-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-22.04 }
          - { platform: linux-arm64, runner: ubuntu-22.04-arm }
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: darwin-arm64, runner: macos-15 }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
      - name: Determine helper version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version=${GITHUB_REF_NAME#helpers-v}
          else
            version=$(node --input-type=module -e "import {HELPERS_VERSION} from './packages/semvi/lib/helpers.js'; console.log(HELPERS_VERSION)")
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a numeric helper version (e.g. helpers-v0.1.0)" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build locked Rust examples
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/semvi-target
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          cargo +1.99.0 build --locked --release --examples
      - name: Smoke-test and package
        env:
          VERSION: ${{ steps.version.outputs.value }}
          PLATFORM: ${{ matrix.platform }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/semvi-target
        run: scripts/package-helpers.sh "$VERSION" "$PLATFORM" "$CARGO_TARGET_DIR/release/examples" "$RUNNER_TEMP/helpers"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: helpers-${{ matrix.platform }}
          path: ${{ runner.temp }}/helpers/
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/helpers-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: helpers-*
          path: artifacts
      - name: Verify and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#helpers-v}
          mkdir release
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            archive="semvi-helpers-$version-$platform.tar.gz"
            dir="artifacts/helpers-$platform"
            (cd "$dir" && shasum -a 256 -c SHA256SUMS)
            cp "$dir/$archive" release/
          done
          cd release
          shasum -a 256 semvi-helpers-*.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false \
            --title "Semvi helpers v$version" --notes "Prebuilt intent and prepare helpers for Semvi." \
            ./*.tar.gz SHA256SUMS
